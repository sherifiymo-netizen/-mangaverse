<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MangaVerse - منصة المانجا الشاملة</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --header-bg: #1f1f1f;
            --text-color: #e0e0e0;
            --accent-color: #339af0;
            --btn-color: #2b8a3e;
        }
        body {
            font-family: Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }
        header {
            background: var(--header-bg);
            padding: 15px 20px;
            border-bottom: 2px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: #fff;
            cursor: pointer;
        }
        header a, .back-btn {
            color: var(--accent-color);
            text-decoration: none;
            cursor: pointer;
            background: none;
            border: none;
            font-size: 1rem;
        }
        .container {
            padding: 20px;
            max-width: 900px;
            margin: auto;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }
        .manga-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            border: 1px solid #333;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .manga-card:hover {
            transform: translateY(-5px);
        }
        .manga-card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 5px;
        }
        .badge {
            background: var(--accent-color);
            color: white;
            padding: 3px 8px;
            font-size: 12px;
            border-radius: 4px;
            display: inline-block;
            margin: 5px 0;
        }
        .btn {
            display: block;
            background: var(--btn-color);
            color: white;
            padding: 8px;
            text-decoration: none;
            border-radius: 4px;
            margin-top: 10px;
            border: none;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
        }
        .manga-info {
            display: flex;
            gap: 20px;
            align-items: center;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .manga-info img {
            width: 150px;
            border-radius: 5px;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            background: var(--card-bg);
            margin-bottom: 10px;
            padding: 12px 15px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #333;
        }
        li button {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        .reader-container {
            text-align: center;
        }
        .reader-container img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 10px auto;
            border-radius: 4px;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <header>
        <h1 onclick="goHome()">📚 MangaVerse</h1>
        <div id="header-nav"></div>
    </header>

    <main class="container">
        <!-- 1. الشاشة الرئيسية: قائمة المانجا -->
        <section id="view-home">
            <h2>🔥 قائمة الأعمال (أساسية وكلاسيكية)</h2>
            <div id="manga-list" class="grid"></div>
        </section>

        <!-- 2. شاشة تفاصيل المانجا والفصول -->
        <section id="view-manga" class="hidden">
            <button class="back-btn" onclick="goHome()">⬅ العودة للرئيسية</button>
            <div class="manga-info" style="margin-top: 15px;">
                <img id="detail-cover" src="" alt="غلاف">
                <div>
                    <h2 id="detail-title" style="margin-top:0;"></h2>
                    <span id="detail-type" class="badge"></span>
                    <p id="detail-desc"></p>
                </div>
            </div>
            <h2>📑 الفصول المتاحة</h2>
            <ul id="chapters-list"></ul>
        </section>

        <!-- 3. شاشة قارئ الفصول -->
        <section id="view-reader" class="hidden">
            <button class="back-btn" id="reader-back-btn">⬅ العودة لتفاصيل المانجا</button>
            <h2 id="reader-title" style="text-align: center; margin: 15px 0;"></h2>
            <div class="reader-container" id="reader-pages"></div>
        </section>
    </main>

    <script>
        // قاعدة البيانات المدمجة داخل الكود (تتضمن عمل أساسي وعمل قديم كلاسيكي)
        const mangaData = [
            {
                id: "naruto",
                title: "ناروتو - Naruto (عمل أساسي)",
                type: "حديثة / شهيرة",
                description: "قصة نينجا شاب يسعى لتحقيق حلمه بأن يصبح الهوكاجي ونيل اعتراف الجميع.",
                cover: "images/covers/manga1-cover.jpg", // استبدل برابط صورتك أو مسارها الفعلي
                chapters: [
                    {
                        number: 1,
                        title: "الفصل 1: أوزوماكي ناروتو",
                        pages: [
                            "images/chapters/manga1-ch1/01.jpg",
                            "images/chapters/manga1-ch1/02.jpg"
                        ]
                    }
                ]
            },
            {
                id: "astro-boy",
                title: "أسترو بوي - Astro Boy (عمل كلاسيكي قديم)",
                type: "كلاسيكي",
                description: "من أعرق وأقدم أعمال المانجا والأنمي التي أرسلت قواعد الخيال العلمي والسايبربانك.",
                cover: "images/covers/manga2-cover.jpg", // استبدل برابط صورتك أو مسارها الفعلي
                chapters: [
                    {
                        number: 1,
                        title: "الفصل 1: البداية الكلاسيكية",
                        pages: [
                            "images/chapters/manga2-ch1/01.jpg",
                            "images/chapters/manga2-ch1/02.jpg"
                        ]
                    }
                ]
            }
        ];

        // دوال التنقل وعرض المحتوى ديناميكياً
        function goHome() {
            document.getElementById('view-home').classList.remove('hidden');
            document.getElementById('view-manga').classList.add('hidden');
            document.getElementById('view-reader').classList.add('hidden');
            document.getElementById('header-nav').innerHTML = '';
            window.scrollTo(0, 0);
        }

        function showMangaDetails(mangaId) {
            const manga = mangaData.find(m => m.id === mangaId);
            if (!manga) return;

            document.getElementById('detail-title').innerText = manga.title;
            document.getElementById('detail-cover').src = manga.cover;
            document.getElementById('detail-desc').innerText = manga.description;
            document.getElementById('detail-type').innerText = manga.type;

            const chList = document.getElementById('chapters-list');
            chList.innerHTML = '';
            manga.chapters.forEach(ch => {
                chList.innerHTML += `
                    <li>
                        <span>${ch.title}</span>
                        <button onclick="readChapter('${manga.id}', ${ch.number})">قراءة</button>
                    </li>
                `;
            });

            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-manga').classList.remove('hidden');
            document.getElementById('view-reader').classList.add('hidden');
            window.scrollTo(0, 0);
        }

        function readChapter(mangaId, chapterNum) {
            const manga = mangaData.find(m => m.id === mangaId);
            const chapter = manga.chapters.find(c => c.number === chapterNum);
            if (!chapter) return;

            document.getElementById('reader-title').innerText = `${manga.title} - ${chapter.title}`;
            
            // زر العودة لتفاصيل المانجا الخاصة بهذا العمل
            const backBtn = document.getElementById('reader-back-btn');
            backBtn.setAttribute('onclick', `showMangaDetails('${manga.id}')`);

            const pagesContainer = document.getElementById('reader-pages');
            pagesContainer.innerHTML = '';
            chapter.pages.forEach(pageUrl => {
                pagesContainer.innerHTML += `<img src="${pageUrl}" alt="صفحة المانجا" onerror="this.src='https://via.placeholder.com/600x900?text=صورة+تجريبية+أو+غير+متوفرة'">`;
            });

            document.getElementById('view-manga').classList.add('hidden');
            document.getElementById('view-reader').classList.remove('hidden');
            window.scrollTo(0, 0);
        }

        // تهيئة الصفحة الرئيسية عند التحميل
        document.addEventListener("DOMContentLoaded", () => {
            const mangaListContainer = document.getElementById('manga-list');
            mangaData.forEach(manga => {
                mangaListContainer.innerHTML += `
                    <div class="manga-card" onclick="showMangaDetails('${manga.id}')">
                        <img src="${manga.cover}" alt="${manga.title}" onerror="this.src='https://via.placeholder.com/220x280?text=غلاف+المانجا'">
                        <h3>${manga.title}</h3>
                        <span class="badge">${manga.type}</span>
                        <p style="font-size: 0.85rem; color: #aaa;">${manga.description.substring(0, 50)}...</p>
                        <button class="btn">تصفح الفصول</button>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
