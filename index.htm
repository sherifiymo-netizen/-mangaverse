<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MangaVerse</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');

*{box-sizing:border-box}
body{
    margin:0;
    font-family:'Cairo',Arial,sans-serif;
    background:#080b14;
    color:#fff;
}
button,input{font-family:inherit}

header{
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(8,11,20,.94);
    backdrop-filter:blur(15px);
    border-bottom:1px solid #202638;
}
.nav{
    max-width:1200px;
    margin:auto;
    padding:14px 20px;
    display:flex;
    align-items:center;
    gap:20px;
}
.logo{
    font-size:24px;
    font-weight:800;
    color:#9b7cff;
    white-space:nowrap;
}
.search{
    flex:1;
    background:#121725;
    border:1px solid #283047;
    border-radius:14px;
    padding:12px 16px;
    color:#fff;
    outline:none;
}
.search:focus{border-color:#8b5cf6}
.coins{
    background:#171d2e;
    padding:9px 14px;
    border-radius:12px;
    color:#ffd84d;
    font-weight:700;
}

.hero{
    max-width:1200px;
    margin:25px auto;
    padding:45px 30px;
    border-radius:24px;
    background:
      radial-gradient(circle at 20% 20%,#7138ff55,transparent 35%),
      linear-gradient(135deg,#15102b,#111827);
    border:1px solid #292d45;
}
.hero h1{font-size:42px;margin:0 0 10px}
.hero p{color:#b7bed1;font-size:17px}
.hero button{
    border:0;
    background:#8b5cf6;
    color:#fff;
    padding:12px 22px;
    border-radius:12px;
    font-weight:700;
    cursor:pointer;
}

.container{max-width:1200px;margin:auto;padding:0 20px 60px}
.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:30px 0 16px;
}
.section-title h2{margin:0}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:18px;
}

.card{
    background:#111624;
    border:1px solid #252c3e;
    border-radius:17px;
    overflow:hidden;
    cursor:pointer;
    transition:.2s;
}
.card:hover{
    transform:translateY(-5px);
    border-color:#8b5cf6;
}
.cover{
    width:100%;
    aspect-ratio:2/3;
    display:block;
    background:#151a29;
}
.card-body{padding:13px}
.card h3{
    margin:0 0 7px;
    font-size:16px;
}
.meta{
    color:#9da6ba;
    font-size:13px;
}
.rating{color:#ffd84d}

.tags{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin:15px 0;
}
.tag{
    background:#171d2d;
    border:1px solid #2a3349;
    color:#c9cfe0;
    padding:7px 12px;
    border-radius:20px;
    cursor:pointer;
}

.reader{
    position:fixed;
    inset:0;
    z-index:999;
    background:#05070c;
    display:none;
    overflow:auto;
}
.reader.active{display:block}
.reader-top{
    position:sticky;
    top:0;
    z-index:2;
    background:#0c101aee;
    border-bottom:1px solid #252b3b;
    padding:12px 18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}
.reader-pages{
    max-width:900px;
    margin:20px auto;
    padding:0 15px;
}
.reader-pages img{
    width:100%;
    display:block;
    margin:0 auto 14px;
    border-radius:5px;
    background:#fff;
}
.reader-btn{
    background:#171d2d;
    color:#fff;
    border:1px solid #30384e;
    padding:9px 13px;
    border-radius:10px;
    cursor:pointer;
}
.close{
    background:#ef4444;
    border:0;
    color:#fff;
    padding:9px 15px;
    border-radius:10px;
    cursor:pointer;
}

.modal{
    position:fixed;
    inset:0;
    z-index:500;
    background:#000b;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}
.modal.active{display:flex}
.modal-box{
    max-width:800px;
    width:100%;
    max-height:90vh;
    overflow:auto;
    background:#111624;
    border:1px solid #30384b;
    border-radius:20px;
    padding:22px;
}
.detail{
    display:grid;
    grid-template-columns:220px 1fr;
    gap:25px;
}
.detail img{
    width:100%;
    border-radius:15px;
}
.chapter{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px;
    background:#171d2c;
    border-radius:12px;
    margin:8px 0;
}
.chapter button{
    border:0;
    background:#8b5cf6;
    color:white;
    padding:8px 13px;
    border-radius:9px;
    cursor:pointer;
}

.empty{
    text-align:center;
    padding:40px;
    color:#929bad;
}

@media(max-width:700px){
    .nav{gap:8px}
    .logo{font-size:19px}
    .coins{display:none}
    .hero h1{font-size:30px}
    .detail{grid-template-columns:1fr}
    .detail img{max-width:220px;margin:auto}
    .grid{grid-template-columns:repeat(2,1fr);gap:12px}
}
</style>
</head>

<body>

<header>
<div class="nav">
    <div class="logo">📚 MangaVerse</div>
    <input id="search" class="search" placeholder="ابحث عن مانغا..." oninput="searchManga()">
    <div class="coins">🪙 120</div>
</div>
</header>

<section class="hero">
<div class="container">
    <h1>عالم المانغا بين يديك ⚡</h1>
    <p>اكتشف أعمالاً مشهورة، تابع الفصول، واحفظ المانغا المفضلة لديك.</p>
    <button onclick="document.getElementById('library').scrollIntoView({behavior:'smooth'})">
        تصفح المكتبة
    </button>
</div>
</section>

<main class="container" id="library">

<div class="section-title">
    <h2>🔥 المانغا المشهورة</h2>
</div>

<div class="tags">
    <button class="tag" onclick="filterManga('all')">الكل</button>
    <button class="tag" onclick="filterManga('أكشن')">أكشن</button>
    <button class="tag" onclick="filterManga('مغامرة')">مغامرة</button>
    <button class="tag" onclick="filterManga('فانتازيا')">فانتازيا</button>
</div>

<div id="mangaGrid" class="grid"></div>

</main>

<!-- التفاصيل -->
<div id="detailModal" class="modal">
<div class="modal-box">
    <button class="close" onclick="closeModal()">إغلاق</button>
    <div id="detailContent"></div>
</div>
</div>

<!-- القارئ -->
<div id="reader" class="reader">

<div class="reader-top">
    <strong id="readerTitle">القارئ</strong>
    <div>
        <button class="reader-btn" onclick="previousChapter()">⬅ الفصل السابق</button>
        <button class="reader-btn" onclick="nextChapter()">الفصل التالي ➡</button>
        <button class="close" onclick="closeReader()">✕</button>
    </div>
</div>

<div id="readerPages" class="reader-pages"></div>

</div>

<script>

/* =========================================
   بيانات المانغا
========================================= */

const mangaData = [

{
    id:1,
    title:"One Piece",
    genre:["أكشن","مغامرة"],
    rating:"9.5",
    author:"Eiichiro Oda",
    color1:"#172554",
    color2:"#2563eb",
    symbol:"☠",
    chapters:5
},

{
    id:2,
    title:"Naruto",
    genre:["أكشن","مغامرة"],
    rating:"9.2",
    author:"Masashi Kishimoto",
    color1:"#7c2d12",
    color2:"#f97316",
    symbol:"忍",
    chapters:5
},

{
    id:3,
    title:"Demon Slayer",
    genre:["أكشن","فانتازيا"],
    rating:"9.1",
    author:"Koyoharu Gotouge",
    color1:"#172554",
    color2:"#dc2626",
    symbol:"⚔",
    chapters:5
},

{
    id:4,
    title:"Jujutsu Kaisen",
    genre:["أكشن","فانتازيا"],
    rating:"9.0",
    author:"Gege Akutami",
    color1:"#111827",
    color2:"#7c3aed",
    symbol:"呪",
    chapters:5
},

{
    id:5,
    title:"Attack on Titan",
    genre:["أكشن","فانتازيا"],
    rating:"9.4",
    author:"Hajime Isayama",
    color1:"#172016",
    color2:"#92400e",
    symbol:"巨",
    chapters:5
},

{
    id:6,
    title:"Solo Leveling",
    genre:["أكشن","فانتازيا"],
    rating:"9.3",
    author:"Chugong",
    color1:"#09090b",
    color2:"#2563eb",
    symbol:"影",
    chapters:5
}

];

/* =========================================
   غلاف SVG أصلي
========================================= */

function makeCover(m){

return `
<svg class="cover"
xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 500 750">

<defs>
<linearGradient id="g${m.id}" x1="0" y1="0" x2="1" y2="1">
<stop stop-color="${m.color1}"/>
<stop offset="1" stop-color="${m.color2}"/>
</linearGradient>

<radialGradient id="r${m.id}">
<stop stop-color="white" stop-opacity=".35"/>
<stop offset="1" stop-color="white" stop-opacity="0"/>
</radialGradient>
</defs>

<rect width="500" height="750" fill="url(#g${m.id})"/>

<circle cx="390" cy="130" r="170" fill="url(#r${m.id})"/>

<path d="M0 590 Q170 500 300 590 T600 550 V750 H0Z"
fill="#000" opacity=".35"/>

<text x="250" y="330"
text-anchor="middle"
font-size="130"
font-weight="bold"
fill="white"
opacity=".92">${m.symbol}</text>

<text x="250" y="470"
text-anchor="middle"
font-family="Arial"
font-size="38"
font-weight="bold"
fill="white">${m.title}</text>

<text x="250" y="525"
text-anchor="middle"
font-family="Arial"
font-size="19"
fill="#ddd">MANGAVERSE</text>

<rect x="80" y="620" width="340" height="2"
fill="white" opacity=".5"/>

<text x="250" y="665"
text-anchor="middle"
font-size="17"
fill="#ddd">قراءة وتجربة تجريبية</text>

</svg>`;
}

/* =========================================
   صفحات تجريبية أصلية للقارئ
========================================= */

function makePage(m,chapter,page){

return `
<svg xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 900 1200">

<defs>
<linearGradient id="p${m.id}${chapter}${page}"
x1="0" y1="0" x2="1" y2="1">
<stop stop-color="${m.color1}"/>
<stop offset="1" stop-color="${m.color2}"/>
</linearGradient>
</defs>

<rect width="900" height="1200" fill="#f4f4f5"/>

<rect x="35" y="35" width="830" height="1130"
rx="10" fill="url(#p${m.id}${chapter}${page})"/>

<circle cx="450" cy="430" r="180"
fill="none" stroke="white" stroke-width="8" opacity=".35"/>

<path d="M180 720 L450 400 L720 720"
fill="none" stroke="white" stroke-width="12" opacity=".7"/>

<text x="450" y="250"
text-anchor="middle"
font-family="Arial"
font-size="55"
font-weight="bold"
fill="white">${m.title}</text>

<text x="450" y="810"
text-anchor="middle"
font-family="Arial"
font-size="38"
fill="white">الفصل ${chapter}</text>

<text x="450" y="875"
text-anchor="middle"
font-family="Arial"
font-size="28"
fill="white">صفحة ${page}</text>

<text x="450" y="1050"
text-anchor="middle"
font-family="Arial"
font-size="25"
fill="white">MangaVerse Demo</text>

</svg>`;
}

/* =========================================
   عرض المانغا
========================================= */

let currentList=[...mangaData];

function render(){

const grid=document.getElementById("mangaGrid");

grid.innerHTML=currentList.map(m=>`

<div class="card" onclick="openManga(${m.id})">

${makeCover(m)}

<div class="card-body">

<h3>${m.title}</h3>

<div class="meta">
<span class="rating">★ ${m.rating}</span>
<br>
${m.genre.join(" • ")}
<br>
${m.chapters} فصول
</div>

</div>

</div>

`).join("");

}

render();

/* =========================================
   البحث
========================================= */

function searchManga(){

const q=document.getElementById("search").value.trim().toLowerCase();

currentList=mangaData.filter(m=>
m.title.toLowerCase().includes(q) ||
m.author.toLowerCase().includes(q) ||
m.genre.some(g=>g.toLowerCase().includes(q))
);

render();

}

/* =========================================
   فلترة
========================================= */

function filterManga(type){

if(type==="all"){
currentList=[...mangaData];
}else{
currentList=mangaData.filter(m=>m.genre.includes(type));
}

render();

}

/* =========================================
   تفاصيل المانغا
========================================= */

function openManga(id){

const m=mangaData.find(x=>x.id===id);

document.getElementById("detailContent").innerHTML=`

<div class="detail">

<div>
${makeCover(m)}
</div>

<div>

<h1>${m.title}</h1>

<p class="meta">✍ المؤلف: ${m.author}</p>

<p>
<span class="rating">★ ${m.rating}</span>
</p>

<div class="tags">
${m.genre.map(g=>`<span class="tag">${g}</span>`).join("")}
</div>

<h2>📚 الفصول</h2>

${Array.from({length:m.chapters},(_,i)=>`

<div class="chapter">

<span>الفصل ${i+1}</span>

<button onclick="openReader(${m.id},${i+1})">
📖 قراءة
</button>

</div>

`).join("")}

</div>

</div>
`;

document.getElementById("detailModal").classList.add("active");

}

function closeModal(){
document.getElementById("detailModal").classList.remove("active");
}

/* =========================================
   القارئ
========================================= */

let activeManga=null;
let activeChapter=1;

function openReader(id,chapter){

closeModal();

activeManga=mangaData.find(x=>x.id===id);
activeChapter=chapter;

document.getElementById("readerTitle").textContent=
`${activeManga.title} — الفصل ${chapter}`;

let pages="";

for(let i=1;i<=6;i++){

pages+=`
<img alt="صفحة ${i}"
src="data:image/svg+xml;charset=UTF-8,${encodeURIComponent(
makePage(activeManga,chapter,i)
)}">
`;

}

document.getElementById("readerPages").innerHTML=pages;

document.getElementById("reader").classList.add("active");

window.scrollTo(0,0);

}

function closeReader(){
document.getElementById("reader").classList.remove("active");
}

function nextChapter(){

if(!activeManga)return;

if(activeChapter<activeManga.chapters){
openReader(activeManga.id,activeChapter+1);
}else{
alert("وصلت لآخر فصل متاح.");
}

}

function previousChapter(){

if(!activeManga)return;

if(activeChapter>1){
openReader(activeManga.id,activeChapter-1);
}else{
alert("هذا أول فصل.");
}

}

</script>

</body>
</html>
