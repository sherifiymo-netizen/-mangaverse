<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MangaVerse</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#070914;
 color:#fff;
 font-family:Arial,Tahoma,sans-serif;
}
header{
 position:sticky;
 top:0;
 z-index:10;
 padding:15px 5%;
 background:#0b1020ee;
 backdrop-filter:blur(15px);
 border-bottom:1px solid #252e46;
 display:flex;
 gap:15px;
 align-items:center;
}
.logo{
 font-size:25px;
 font-weight:900;
 white-space:nowrap;
}
.logo span{color:#8c62ff}
.search{
 flex:1;
 max-width:550px;
 padding:12px 16px;
 background:#12192b;
 border:1px solid #293550;
 border-radius:14px;
 color:#fff;
 outline:none;
}
button{
 border:0;
 cursor:pointer;
 border-radius:10px;
 padding:10px 15px;
 color:#fff;
 background:#182239;
}
.primary{
 background:linear-gradient(135deg,#8b5cf6,#5b35d5);
}
.hero{
 margin:30px 5%;
 padding:45px;
 min-height:330px;
 border:1px solid #293550;
 border-radius:25px;
 background:
 radial-gradient(circle at 80% 50%,#6d42dc77,transparent 35%),
 linear-gradient(120deg,#11182b,#090d19);
 display:flex;
 align-items:center;
 justify-content:space-between;
}
.hero h1{
 font-size:45px;
 margin:15px 0;
}
.hero p{
 color:#adb7cb;
 max-width:650px;
 line-height:1.8;
}
.hero-art{
 width:250px;
 height:250px;
 border-radius:50%;
 display:grid;
 place-items:center;
 font-size:120px;
 background:radial-gradient(circle,#a98aff,#39227a 45%,transparent 70%);
}
.container{padding:0 5% 70px}
.toolbar{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin:35px 0 20px;
}
.filters{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
}
.filter.active{
 background:#7c4dff;
}
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
 gap:18px;
}
.card{
 overflow:hidden;
 border:1px solid #26314a;
 border-radius:17px;
 background:#0e1423;
 transition:.2s;
}
.card:hover{
 transform:translateY(-5px);
 border-color:#815cff;
}
.cover{
 width:100%;
 height:250px;
 display:block;
}
.card-body{padding:14px}
.title{
 font-size:17px;
 font-weight:bold;
 margin-bottom:8px;
}
.meta{
 color:#9ba7bd;
 font-size:13px;
 line-height:1.8;
}
.actions{
 display:flex;
 gap:7px;
 margin-top:12px;
}
.actions button{flex:1}
.ad{
 margin:25px 0;
 padding:20px;
 border:1px dashed #3b4762;
 border-radius:15px;
 text-align:center;
 color:#aab4c8;
}
.modal{
 display:none;
 position:fixed;
 inset:0;
 z-index:100;
 background:#000b;
 padding:20px;
 align-items:center;
 justify-content:center;
}
.modal.show{display:flex}
.box{
 width:100%;
 max-width:1050px;
 max-height:92vh;
 overflow:auto;
 background:#0d1424;
 border:1px solid #303d5b;
 border-radius:20px;
 padding:20px;
}
.modal-head{
 display:flex;
 align-items:center;
 justify-content:space-between;
 margin-bottom:20px;
}
.close{
 width:40px;
 height:40px;
 border-radius:50%;
}
.details{
 display:grid;
 grid-template-columns:220px 1fr;
 gap:25px;
}
.chapter{
 padding:13px;
 margin:8px 0;
 background:#141d32;
 border:1px solid #293550;
 border-radius:10px;
 cursor:pointer;
}
.chapter:hover{background:#21184b}
.reader{
 text-align:center;
}
.page{
 min-height:500px;
 padding:20px;
 background:#090e1a;
 border-radius:15px;
 border:1px solid #293550;
}
.panel{
 max-width:700px;
 min-height:130px;
 margin:15px auto;
 border:3px solid #111;
 border-radius:8px;
 display:grid;
 place-items:center;
 position:relative;
 overflow:hidden;
 background:
 radial-gradient(circle at 25% 30%,#8c65ff55,transparent 20%),
 linear-gradient(135deg,#26334d,#111827);
}
.panel:before{
 content:"";
 width:100px;
 height:100px;
 border-radius:50%;
 background:#a68cff44;
 position:absolute;
 left:30%;
 top:15%;
}
.bubble{
 position:relative;
 background:#fff;
 color:#111;
 padding:10px 18px;
 border-radius:16px;
 font-weight:bold;
 box-shadow:0 5px 20px #0008;
}
.reader-controls{
 display:flex;
 justify-content:center;
 gap:10px;
 margin-top:15px;
}
.form input,.form textarea,.form select{
 width:100%;
 padding:12px;
 margin:8px 0 15px;
 border-radius:10px;
 border:1px solid #293550;
 background:#080d18;
 color:white;
}
.form textarea{min-height:120px}
.coin{
 color:#ffd35a;
 font-size:25px;
 font-weight:bold;
}
.empty{
 text-align:center;
 color:#9ba7bd;
 padding:60px 10px;
}
footer{
 border-top:1px solid #252e46;
 padding:30px 5%;
 color:#8f9bb0;
}
.toast{
 position:fixed;
 bottom:20px;
 left:20px;
 z-index:200;
 background:#17223a;
 border:1px solid #384865;
 padding:13px 18px;
 border-radius:12px;
 transform:translateY(100px);
 opacity:0;
 transition:.3s;
}
.toast.show{
 transform:translateY(0);
 opacity:1;
}
@media(max-width:750px){
 header{flex-wrap:wrap}
 .search{order:3;flex-basis:100%}
 .hero{padding:28px}
 .hero h1{font-size:32px}
 .hero-art{display:none}
 .details{grid-template-columns:1fr}
 .details .cover{max-width:230px;margin:auto}
 .toolbar{display:block}
 .filters{margin-top:15px}
}
</style>
</head>

<body>

<header>
 <div class="logo">Manga<span>Verse</span></div>

 <input
   id="search"
   class="search"
   placeholder="🔎 ابحث عن مانغا..."
   oninput="render()"
 >

 <button onclick="showFavorites()">❤️ المفضلة</button>
 <button onclick="showAccount()">👤 حسابي</button>
 <button class="primary" onclick="publishForm()">＋ نشر</button>
</header>

<section class="hero">
 <div>
   <small>✨ أعمال أصلية</small>
   <h1>اكتشف عالمًا جديدًا من المانغا</h1>
   <p>
     اقرأ القصص، استكشف الفصول، واحفظ مانغاك المفضلة
     داخل MangaVerse.
   </p>
   <button class="primary" onclick="document.getElementById('all').scrollIntoView()">
     ابدأ القراءة ←
   </button>
 </div>

 <div class="hero-art">✦</div>
</section>

<div class="container">

 <div class="ad">
   📢 <b>مساحة إعلانية تجريبية</b>
   — يمكن ربطها لاحقًا بنظام إعلانات حقيقي.
 </div>

 <div class="toolbar">
   <div>
     <h2 id="all">📚 المانغا</h2>
     <p class="meta">15 سلسلة أصلية</p>
   </div>

   <div class="filters" id="filters"></div>
 </div>

 <section id="grid" class="grid"></section>

</div>

<footer>
 <b>Manga<span>Verse</span></b>
 <p>منصة تجريبية للقصص والمانغا الأصلية.</p>
</footer>

<div id="modal" class="modal" onclick="outside(event)">
 <div id="box" class="box"></div>
</div>

<div id="toast" class="toast"></div>

<script>

/* =========================
   بيانات الـ15 مانغا
========================= */

const manga = [

{
 id:"veldora",
 title:"فيلدورا — عرش الرماد",
 cat:"فانتازيا",
 author:"MangaVerse Studio",
 desc:"شاب يكتشف سرًا قديمًا مرتبطًا بعرش من الرماد.",
 color:"#7c4dff",
 views:12450
},

{
 id:"hunter",
 title:"آخر صياد",
 cat:"أكشن",
 author:"Dark Moon",
 desc:"صياد وحيد يكتشف أن الوحوش ليست كما تبدو.",
 color:"#ff477e",
 views:9870
},

{
 id:"stars",
 title:"بوابة النجوم",
 cat:"مغامرة",
 author:"Kaito",
 desc:"بوابة سماوية تفتح طريقًا إلى عالم مجهول.",
 color:"#39a8ff",
 views:8450
},

{
 id:"ghost",
 title:"مدينة الأشباح",
 cat:"غموض",
 author:"Noir",
 desc:"مدينة لا يظهر سكانها إلا بعد منتصف الليل.",
 color:"#ffb347",
 views:7320
},

{
 id:"sword",
 title:"سيف الظلام",
 cat:"أكشن",
 author:"Raven",
 desc:"سيف غامض يختار صاحبه بدلًا من أن يُختار.",
 color:"#b45cff",
 views:6890
},

{
 id:"flower",
 title:"زهرة الشتاء",
 cat:"دراما",
 author:"Ayla",
 desc:"زهرة لا تتفتح إلا في أبرد ليلة من العام.",
 color:"#69d7d0",
 views:6210
},

{
 id:"star",
 title:"النجم الأخير",
 cat:"مغامرة",
 author:"Nova",
 desc:"نجم يسقط على الأرض ويحمل رسالة غير متوقعة.",
 color:"#668cff",
 views:5980
},

{
 id:"demon",
 title:"ملك الشياطين",
 cat:"فانتازيا",
 author:"Kuro",
 desc:"أمير منسي يعود ليواجه قوة تتجاوز الممالك.",
 color:"#ff4d5e",
 views:5710
},

{
 id:"heart",
 title:"قلب الضوء",
 cat:"دراما",
 author:"Luma",
 desc:"فتاة تبحث عن مصدر الضوء داخل مدينة مظلمة.",
 color:"#ffd15c",
 views:5440
},

{
 id:"dragon",
 title:"أسطورة التنين",
 cat:"فانتازيا",
 author:"Arden",
 desc:"تنين قديم يوقظ أسطورة لم تنتهِ بعد.",
 color:"#48d99e",
 views:5210
},

{
 id:"warrior",
 title:"المحارب الصامت",
 cat:"أكشن",
 author:"Zen",
 desc:"محارب صامت يحمل وعدًا لم يخبر به أحدًا.",
 color:"#769bff",
 views:4900
},

{
 id:"return",
 title:"العودة المظلمة",
 cat:"غموض",
 author:"Eclipse",
 desc:"شخص يعود من مكان مجهول ليجد عالمه مختلفًا.",
 color:"#dc5de5",
 views:4630
},

{
 id:"spirits",
 title:"عالم الأرواح",
 cat:"فانتازيا",
 author:"Mira",
 desc:"أرواح حارسة تحاول حماية بوابة بين عالمين.",
 color:"#54c8c0",
 views:4320
},

{
 id:"shadow",
 title:"الظل الأخير",
 cat:"غموض",
 author:"Shade",
 desc:"ظل غامض يظهر كلما اقتربت الحقيقة.",
 color:"#7373ff",
 views:4050
},

{
 id:"horizon",
 title:"أفق جديد",
 cat:"مغامرة",
 author:"Sky",
 desc:"رحلة جديدة تبدأ عندما يغادر البطل حدود مدينته.",
 color:"#a8dc5c",
 views:3780
}

];

/* =========================
   النظام
========================= */

let category="الكل";
let current=null;
let chapter=0;
let page=0;

let favorites=
 JSON.parse(localStorage.getItem("mv_favorites")||"[]");

let coins=
 Number(localStorage.getItem("mv_coins")||"100");


const categories=[
 "الكل",
 ...new Set(manga.map(x=>x.cat))
];


/* =========================
   رسم الغلاف داخل HTML
========================= */

function cover(m){

 return `
 <svg class="cover"
      viewBox="0 0 400 560"
      xmlns="http://www.w3.org/2000/svg">

   <defs>
    <radialGradient id="g${m.id}">
      <stop stop-color="${m.color}"/>
      <stop offset="1" stop-color="#080b14"/>
    </radialGradient>
   </defs>

   <rect width="400" height="560"
         fill="url(#g${m.id})"/>

   <circle
      cx="200"
      cy="260"
      r="150"
      fill="${m.color}"
      opacity=".18"/>

   <circle
      cx="200"
      cy="240"
      r="72"
      fill="#111827"
      stroke="${m.color}"
      stroke-width="5"/>

   <path
      d="M120 500 Q200 330 280 500"
      fill="#090b13"
      stroke="${m.color}"
      stroke-width="4"/>

   <path
      d="M150 240 Q200 185 250 240"
      fill="none"
      stroke="#fff"
      stroke-width="4"
      opacity=".6"/>

   <circle cx="175" cy="240"
           r="6" fill="#fff"/>

   <circle cx="225" cy="240"
           r="6" fill="#fff"/>

   <text x="200"
         y="75"
         text-anchor="middle"
         fill="#fff"
         font-size="19"
         font-family="Arial"
         font-weight="bold">
     MANGAVERSE
   </text>

   <text x="200"
         y="520"
         text-anchor="middle"
         fill="#fff"
         font-size="22"
         font-family="Arial"
         font-weight="bold">
     ${m.title}
   </text>

 </svg>
 `;
}


/* =========================
   إنشاء الفصول
========================= */

function chapters(m){

 return [

 {
  title:"البداية",
  free:true,
  cost:0
 },

 {
  title:"الظل الغامض",
  free:false,
  cost:20
 },

 {
  title:"المواجهة",
  free:false,
  cost:30
 },

 {
  title:"السر",
  free:false,
  cost:40
 }

 ];
}


/* =========================
   الصفحات
========================= */

function pageTexts(m,ch){

 const texts=[
  [
   "استيقظ البطل على علامة غامضة فوق المدينة.",
   "صوت مجهول ناداه من بين الأبراج.",
   "شعر بطاقة غريبة تتحرك بداخله."
  ],
  [
   "ظهر ظل غامض عند نهاية الطريق.",
   "توقف الجميع للحظة وكأن الزمن تجمد.",
   "ثم بدأت المطاردة."
  ],
  [
   "وصلت المواجهة إلى ذروتها.",
   "القوة الحقيقية بدأت بالظهور.",
   "لكن المعركة لم تنتهِ بعد."
  ],
  [
   "وجد البطل الباب الذي يبحث عنه.",
   "وراء الباب كان السر الذي غيّر كل شيء.",
   "يتبع..."
  ]
 ];

 return texts[ch];
}


/* =========================
   الصفحة الرئيسية
========================= */

function render(){

 const query=
  document.getElementById("search")
  .value
  .toLowerCase();

 document.getElementById("filters").innerHTML=
 categories.map(c=>`
   <button
    class="filter ${category===c?"active":""}"
    onclick="setCategory('${c}')">
    ${c}
   </button>
 `).join("");

 const list=manga.filter(m=>{

   const matchCat=
     category==="الكل" || m.cat===category;

   const matchSearch=
     m.title.toLowerCase().includes(query) ||
     m.author.toLowerCase().includes(query);

   return matchCat && matchSearch;

 });

 document.getElementById("grid").innerHTML=
 list.length
 ?
 list.map(card).join("")
 :
 `<div class="empty">لا توجد نتائج.</div>`;
}


function card(m){

 const fav=favorites.includes(m.id);

 return `
 <article class="card">

   ${cover(m)}

   <div class="card-body">

    <div class="title">
      ${m.title}
    </div>

    <div class="meta">
      ${m.cat}<br>
      ✍️ ${m.author}<br>
      👁️ ${m.views.toLocaleString("ar")}
    </div>

    <div class="actions">

      <button
       class="primary"
       onclick="openManga('${m.id}')">
       📖 قراءة
      </button>

      <button
       onclick="favorite('${m.id}')">
       ${fav?"❤️":"♡"}
      </button>

    </div>

   </div>

 </article>
 `;
}


function setCategory(c){

 category=c;
 render();

}


/* =========================
   تفاصيل المانغا
========================= */

function openManga(id){

 current=manga.find(x=>x.id===id);

 const ch=chapters(current);

 show(`
 <div class="modal-head">

  <div>
   <h2>${current.title}</h2>
   <p class="meta">
    ${current.cat} · ${current.author}
   </p>
  </div>

  <button
   class="close"
   onclick="closeModal()">
   ×
  </button>

 </div>

 <div class="details">

   <div>
    ${cover(current)}
   </div>

   <div>

    <p class="meta">
      ${current.desc}
    </p>

    <h3>📚 الفصول</h3>

    ${ch.map((x,i)=>`

     <div
      class="chapter"
      onclick="openChapter(${i})">

      📖 الفصل ${i+1}
      — ${x.title}

      <span style="float:left">

       ${x.free
        ? "مجاني"
        : "🪙 "+x.cost}

      </span>

     </div>

    `).join("")}

   </div>

 </div>
 `);

}


/* =========================
   قارئ المانغا
========================= */

function openChapter(i){

 const ch=chapters(current)[i];

 if(!ch.free && coins<ch.cost){

  show(`
   <div class="modal-head">
    <h2>🔒 الفصل مقفل</h2>

    <button
     class="close"
     onclick="closeModal()">
     ×
    </button>
   </div>

   <p>
    تحتاج ${ch.cost} عملة لفتح هذا الفصل.
   </p>

   <p class="coin">
    🪙 ${coins}
   </p>

   <button
    class="primary"
    onclick="watchAd()">
    📺 شاهد إعلانًا تجريبيًا +5
   </button>
  `);

  return;
 }

 chapter=i;
 page=0;

 renderReader();

}


function renderReader(){

 const texts=pageTexts(current,chapter);

 const content=texts.map(t=>`
   <div class="panel">
    <div class="bubble">
      ${t}
    </div>
   </div>
 `).join("");

 show(`
 <div class="modal-head">

   <div>
    <h2>${current.title}</h2>

    <p class="meta">
      الفصل ${chapter+1}
      · صفحة ${page+1}/4
    </p>
   </div>

   <button
    class="close"
    onclick="closeModal()">
    ×
   </button>

 </div>

 <div class="reader">

   <div class="page">

     ${content}

   </div>

   <div class="reader-controls">

    <button
     onclick="previousPage()">
     ← السابق
    </button>

    <button
     class="primary"
     onclick="nextPage()">
     التالي →
    </button>

   </div>

 </div>
 `);

}


function nextPage(){

 if(page<3){

   page++;
   renderReader();

 }else{

   const ch=chapters(current);

   if(chapter<ch.length-1){

    chapter++;
    page=0;
    renderReader();

   }else{

    toast("🎉 وصلت إلى نهاية المانغا");

   }

 }

}


function previousPage(){

 if(page>0){

   page--;
   renderReader();

 }else if(chapter>0){

   chapter--;
   page=3;
   renderReader();

 }

}


/* =========================
   المفضلة
========================= */

function favorite(id){

 if(favorites.includes(id)){

  favorites=
   favorites.filter(x=>x!==id);

  toast("تمت إزالة المانغا من المفضلة");

 }else{

  favorites.push(id);

  toast("❤️ تمت الإضافة إلى المفضلة");

 }

 localStorage.setItem(
  "mv_favorites",
  JSON.stringify(favorites)
 );

 render();

}


function showFavorites(){

 const list=
  manga.filter(x=>favorites.includes(x.id));

 show(`

  <div class="modal-head">

   <h2>❤️ المفضلة</h2>

   <button
    class="close"
    onclick="closeModal()">
    ×
   </button>

  </div>

  ${
   list.length
   ?
   `<div class="grid">
      ${list.map(card).join("")}
    </div>`
   :
   `<div class="empty">
      لم تضف أي مانغا بعد.
    </div>`
  }

 `);

}


/* =========================
   الحساب والعملات
========================= */

function showAccount(){

 show(`

 <div class="modal-head">

  <h2>👤 حسابي</h2>

  <button
   class="close"
   onclick="closeModal()">
   ×
  </button>

 </div>

 <p class="meta">
  هذا نظام حساب تجريبي يعمل على جهازك.
 </p>

 <div class="coin">
  🪙 ${coins}
 </div>

 <p>
  العملات هنا افتراضية وليست أموالًا حقيقية.
 </p>

 <button
  class="primary"
  onclick="watchAd()">
  📺 مشاهدة إعلان تجريبي +5
 </button>

 `);

}


function watchAd(){

 coins+=5;

 localStorage.setItem(
  "mv_coins",
  coins
 );

 toast("🪙 تمت إضافة 5 عملات");

 showAccount();

}


/* =========================
   نشر قصة
========================= */

function publishForm(){

 show(`

 <div class="modal-head">

  <h2>✍️ نشر قصة</h2>

  <button
   class="close"
   onclick="closeModal()">
   ×
  </button>

 </div>

 <form
  class="form"
  onsubmit="publish(event)">

  <label>عنوان القصة</label>

  <input
   id="newTitle"
   required
   maxlength="60"
   placeholder="اسم المانغا">

  <label>التصنيف</label>

  <select id="newCat">

   <option>أكشن</option>
   <option>فانتازيا</option>
   <option>مغامرة</option>
   <option>غموض</option>
   <option>دراما</option>

  </select>

  <label>الوصف</label>

  <textarea
   id="newDesc"
   required
   placeholder="اكتب وصف القصة">
  </textarea>

  <button class="primary">
   🚀 نشر القصة
  </button>

 </form>

 `);

}


function publish(e){

 e.preventDefault();

 const m={

  id:"custom"+Date.now(),

  title:
   document.getElementById("newTitle").value,

  cat:
   document.getElementById("newCat").value,

  author:"كاتب جديد",

  desc:
   document.getElementById("newDesc").value,

  color:"#8c62ff",

  views:0

 };

 manga.unshift(m);

 closeModal();

 render();

 toast("🚀 تم نشر القصة");

}


/* =========================
   النوافذ
========================= */

function show(content){

 document.getElementById("box").innerHTML=
  content;

 document
  .getElementById("modal")
  .classList
  .add("show");

}


function closeModal(){

 document
  .getElementById("modal")
  .classList
  .remove("show");

}


function outside(e){

 if(e.target.id==="modal"){
  closeModal();
 }

}


/* =========================
   الإشعارات
========================= */

function toast(text){

 const t=
  document.getElementById("toast");

 t.textContent=text;

 t.classList.add("show");

 setTimeout(
  ()=>t.classList.remove("show"),
  2300
 );

}


/* =========================
   تشغيل الموقع
========================= */

render();

</script>
