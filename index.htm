<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StoryVerse - منصة المبدعين والقصص</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#8b5cf6',
                        darkBg: '#0f172a',
                        cardBg: '#1e293b'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-darkBg text-slate-100 font-sans antialiased min-h-screen flex flex-col">

    <!-- شريط التنقل العلوي -->
    <header class="bg-cardBg border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 space-x-reverse">
                <i class="fa-solid fa-book-open-reader text-primary text-2xl"></i>
                <span class="text-xl font-bold bg-gradient-to-r from-primary to-pink-500 bg-clip-text text-transparent">StoryVerse</span>
            </div>
            <!-- شريط البحث -->
            <div class="hidden md:flex items-center bg-slate-900 rounded-full px-4 py-2 w-96 border border-slate-700">
                <i class="fa-solid fa-search text-slate-400 ml-2"></i>
                <input type="text" id="searchInput" placeholder="ابحث عن قصص، مانجا، مبدعين..." class="bg-transparent border-none outline-none text-sm w-full text-slate-200">
            </div>
            <!-- أزرار الحساب -->
            <div class="flex items-center space-x-4 space-x-reverse">
                <button onclick="openAuthModal()" class="bg-primary hover:bg-primary/85 px-4 py-2 rounded-full text-sm font-semibold transition">تسجيل الدخول</button>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 pb-20 md:pb-6 grid grid-cols-1 md:grid-cols-4 gap-6">
        
        <!-- القائمة الجانبية (الكمبيوتر) -->
        <aside class="hidden md:block col-span-1 space-y-2">
            <a href="#" onclick="switchTab('home')" class="tab-btn flex items-center space-x-3 space-x-reverse px-4 py-3 rounded-xl bg-primary/20 text-primary font-medium transition"><i class="fa-solid fa-house w-6"></i><span>الرئيسية</span></a>
            <a href="#" onclick="switchTab('stories')" class="tab-btn flex items-center space-x-3 space-x-reverse px-4 py-3 rounded-xl hover:bg-slate-800 text-slate-300 transition"><i class="fa-solid fa-book w-6"></i><span>القصص</span></a>
            <a href="#" onclick="switchTab('manga')" class="tab-btn flex items-center space-x-3 space-x-reverse px-4 py-3 rounded-xl hover:bg-slate-800 text-slate-300 transition"><i class="fa-solid fa-masks-theater w-6"></i><span>المانجا</span></a>
            <a href="#" onclick="switchTab('ai')" class="tab-btn flex items-center space-x-3 space-x-reverse px-4 py-3 rounded-xl hover:bg-slate-800 text-slate-300 transition"><i class="fa-solid fa-wand-magic-sparkles w-6 text-pink-400"></i><span>StoryVerse AI</span></a>
            <a href="#" onclick="switchTab('chat')" class="tab-btn flex items-center space-x-3 space-x-reverse px-4 py-3 rounded-xl hover:bg-slate-800 text-slate-300 transition"><i class="fa-solid fa-comments w-6"></i><span>الدردشة والغرف</span></a>
            <a href="#" onclick="switchTab('profile')" class="tab-btn flex items-center space-x-3 space-x-reverse px-4 py-3 rounded-xl hover:bg-slate-800 text-slate-300 transition"><i class="fa-solid fa-user w-6"></i><span>الملف الشخصي</span></a>
        </aside>

        <!-- مساحة العرض الديناميكية -->
        <section id="mainContent" class="col-span-1 md:col-span-3 space-y-6">
            <!-- قسم الرئيسية الافتراضي -->
            <div class="space-y-4">
                <div class="flex space-x-2 space-x-reverse overflow-x-auto pb-2">
                    <button class="px-4 py-1.5 rounded-full bg-primary text-white text-sm whitespace-nowrap">لك</button>
                    <button class="px-4 py-1.5 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm whitespace-nowrap">الأحدث</button>
                    <button class="px-4 py-1.5 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm whitespace-nowrap">الأكثر تفاعلاً</button>
                    <button class="px-4 py-1.5 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm whitespace-nowrap">المبدعون</button>
                </div>

                <!-- بطاقة قصة تجريبية -->
                <div class="bg-cardBg border border-slate-800 rounded-2xl p-5 space-y-4 shadow-lg">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-3 space-x-reverse">
                            <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-purple-500 to-pink-500 flex items-center justify-center font-bold">م</div>
                            <div>
                                <h4 class="font-bold text-sm">محمد المبدع</h4>
                                <span class="text-xs text-slate-400">منذ ساعتين</span>
                            </div>
                        </div>
                        <button class="text-slate-400 hover:text-white"><i class="fa-solid fa-ellipsis-vertical"></i></button>
                    </div>
                    <div>
                        <h3 class="text-lg font-bold mb-2">رحلة إلى أبعاد الزمن - الفصل الأول</h3>
                        <p class="text-slate-300 text-sm leading-relaxed">في عالم يملؤه الغموض، تبدأ رحلة البطل لاكتشاف السر وراء الساعات المتوقفة وكيف يمكن إعادة تدفق الزمن...</p>
                    </div>
                    <div class="rounded-xl overflow-hidden bg-slate-900 h-48 flex items-center justify-center border border-slate-800">
                        <i class="fa-solid fa-image text-4xl text-slate-600"></i>
                    </div>
                    <div class="flex items-center justify-between pt-2 border-t border-slate-800 text-slate-400 text-sm">
                        <button class="hover:text-red-500 flex items-center space-x-1 space-x-reverse"><i class="fa-regular fa-heart"></i><span>245</span></button>
                        <button class="hover:text-primary flex items-center space-x-1 space-x-reverse"><i class="fa-regular fa-comment"></i><span>42</span></button>
                        <button class="hover:text-blue-500 flex items-center space-x-1 space-x-reverse"><i class="fa-solid fa-share"></i><span>مشاركة</span></button>
                        <button class="hover:text-yellow-500"><i class="fa-regular fa-bookmark"></i></button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- شريط التنقل السفلي للهاتف -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-cardBg border-t border-slate-800 flex justify-around py-3 z-50">
        <button onclick="switchTab('home')" class="text-primary flex flex-col items-center text-xs"><i class="fa-solid fa-house text-lg"></i><span>الرئيسية</span></button>
        <button onclick="switchTab('stories')" class="text-slate-400 flex flex-col items-center text-xs"><i class="fa-solid fa-book text-lg"></i><span>القصص</span></button>
        <button onclick="switchTab('ai')" class="text-slate-400 flex flex-col items-center text-xs"><i class="fa-solid fa-wand-magic-sparkles text-lg text-pink-400"></i><span>AI</span></button>
        <button onclick="switchTab('chat')" class="text-slate-400 flex flex-col items-center text-xs"><i class="fa-solid fa-comments text-lg"></i><span>الدردشة</span></button>
        <button onclick="switchTab('profile')" class="text-slate-400 flex flex-col items-center text-xs"><i class="fa-solid fa-user text-lg"></i><span>حسابي</span></button>
    </nav>

    <!-- نافذة تسجيل الدخول المنبثقة (Modal) -->
    <div id="authModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-cardBg border border-slate-800 w-full max-w-md rounded-2xl p-6 space-y-4 relative">
            <button onclick="closeAuthModal()" class="absolute left-4 top-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            <h3 class="text-xl font-bold text-center">تسجيل الدخول إلى StoryVerse</h3>
            <div class="space-y-3">
                <div>
                    <label class="text-xs text-slate-400 block mb-1">البريد الإلكتروني</label>
                    <input type="email5" placeholder="name@example.com" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-primary">
                </div>
                <div>
                    <label class="text-xs text-slate-400 block mb-1">كلمة المرور</label>
                    <input type="password" placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-primary">
                </div>
                <button class="w-full bg-primary hover:bg-primary/85 py-3 rounded-xl font-semibold transition text-sm">دخول</button>
            </div>
        </div>
    </div>

    <!-- JavaScript الأساسي للتحكم بالواجهات -->
    <script>
        function openAuthModal() {
            document.getElementById('authModal').classList.remove('hidden');
            document.getElementById('authModal').classList.add('flex');
        }
        function closeAuthModal() {
            document.getElementById('authModal').classList.remove('flex');
            document.getElementById('authModal').classList.add('hidden');
        }
        function switchTab(tabName) {
            const contentContainer = document.getElementById('mainContent');
            if(tabName === 'ai') {
                contentContainer.innerHTML = `
                    <div class="bg-cardBg border border-slate-800 rounded-2xl p-6 space-y-4">
                        <div class="flex items-center space-x-3 space-x-reverse">
                            <i class="fa-solid fa-wand-magic-sparkles text-2xl text-pink-400"></i>
                            <h2 class="text-xl font-bold">StoryVerse AI - مساعد المبدعين</h2>
                        </div>
                        <p class="text-slate-300 text-sm">اكتب فكرة قصتك أو السيناريو الخاص بك، واطلب من الذكاء الاصطناعي تطويرها أو اقتراح أحداث وشخصيات.</p>
                        <textarea placeholder="اكتب فكرتك هنا (مثلاً: بطل يكتشف قدرته على قراءة أفكار القطط...)" class="w-full h-32 bg-slate-900 border border-slate-700 rounded-xl p-4 text-sm outline-none focus:border-primary resize-none"></textarea>
                        <button class="bg-gradient-to-r from-primary to-pink-600 px-6 py-2.5 rounded-xl text-sm font-semibold shadow-lg">توليد وتطوير الفكرة</button>
                    </div>
                `;
            } else if(tabName === 'profile') {
                contentContainer.innerHTML = `
                    <div class="bg-cardBg border border-slate-800 rounded-2xl p-6 space-y-6">
                        <div class="flex items-center space-x-4 space-x-reverse">
                            <div class="w-20 h-20 rounded-full bg-gradient-to-tr from-purple-500 to-pink-500 flex items-center justify-center text-2xl font-bold">م</div>
                            <div>
                                <h2 class="text-xl font-bold">اسم المستخدم</h2>
                                <p class="text-slate-400 text-sm">@username</p>
                                <p class="text-slate-300 text-sm mt-1">كاتب وصانع قصص خيالية 🚀</p>
                            </div>
                        </div>
                        <div class="flex space-x-6 space-x-reverse border-y border-slate-800 py-4 text-center">
                            <div><span class="block font-bold text-lg">12</span><span class="text-xs text-slate-400">القصص</span></div>
                            <div><span class="block font-bold text-lg">1.4K</span><span class="text-xs text-slate-400">المتابعون</span></div>
                            <div><span class="block font-bold text-lg">340</span><span class="text-xs text-slate-400">المتابَعون</span></div>
                        </div>
                    </div>
                `;
            } else {
                location.reload();
            }
        }
    </script>
</body>
</html>
