<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0d1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MangaVerse</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#0b0d1a;--card:#151933;--tx:#f1f2fb;--mu:#8b91b0;--ac:#7c5cff;--ac2:#ff5c93;--bd:#232848;--sa:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
:root[data-t=light]{--bg:#f4f5fb;--card:#fff;--tx:#141828;--mu:#6b7186;--bd:#e3e5ef}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:Tahoma,system-ui,sans-serif;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
#shell{height:100%;display:flex;flex-direction:column;max-width:900px;margin:auto}
.top{padding:calc(10px + var(--sa)) 16px 10px;display:flex;align-items:center;gap:10px;background:linear-gradient(var(--bg) 70%,transparent)}
.logo{font-weight:900;font-size:22px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.ic{width:38px;height:38px;border-radius:12px;border:1px solid var(--bd);background:var(--card);cursor:pointer;font-size:16px}
#view{flex:1;overflow-y:auto;padding:0 16px 24px;scroll-behavior:smooth}
.pg{animation:in .25s ease}@keyframes in{from{opacity:0;transform:translateY(8px)}}
h2{font-size:18px;margin:22px 0 10px;display:flex;justify-content:space-between;align-items:center}
h2 a{font-size:13px;color:var(--ac);font-weight:400;cursor:pointer}
.feat{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.feat::-webkit-scrollbar,.row::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.fc{flex:none;width:86%;max-width:420px;height:210px;border-radius:22px;position:relative;overflow:hidden;scroll-snap-align:center;cursor:pointer;background:var(--card)}
.fc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fc:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#000d,#0000 70%)}
.fc div{position:absolute;bottom:14px;inset-inline:16px;z-index:1;color:#fff}
.fc b{font-size:20px;display:block}.fc span{font-size:12px;opacity:.85}
.row{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}.row .card{flex:none;width:126px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.card{cursor:pointer;transition:transform .15s}.card:active{transform:scale(.96)}
.card img{width:100%;aspect-ratio:5/7;object-fit:cover;border-radius:14px;background:var(--card);display:block}
.card .t{font-size:13px;font-weight:700;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .s{font-size:11px;color:var(--mu)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:8px -16px 0;padding:0 16px}
.chip{flex:none;padding:6px 16px;border-radius:20px;background:var(--card);border:1px solid var(--bd);color:var(--mu);cursor:pointer;font-size:14px}
.chip.on{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;border-color:transparent}
.sr{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 16px}
.sk{background:linear-gradient(90deg,var(--card),var(--bd),var(--card));background-size:200%;animation:sh 1.2s infinite;border-radius:14px;aspect-ratio:5/7}@keyframes sh{to{background-position:-200%}}
.empty{padding:36px 16px;text-align:center;color:var(--mu)}.empty i{font-size:40px;display:block;font-style:normal}
.btn{border:0;border-radius:14px;padding:12px 18px;background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;font-weight:700;cursor:pointer}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.btn.b{width:100%}
.tabs{display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + var(--sb))}
.tabs button{flex:1;background:none;border:0;color:var(--mu);padding:6px;cursor:pointer;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button i{font-style:normal;font-size:21px}.tabs button.on{color:var(--ac);font-weight:700}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;transform:translateY(100%);transition:transform .3s;visibility:hidden}
.sheet.on{transform:none;visibility:visible}
.hd{height:260px;position:relative;overflow:hidden}
.hd img{width:100%;height:100%;object-fit:cover;filter:blur(18px) brightness(.55);transform:scale(1.2)}
.hd:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg),transparent)}
.hd .x{position:absolute;top:calc(12px + var(--sa));inset-inline-start:14px;z-index:2}
.dt{margin:-130px 16px 0;position:relative;z-index:1;display:flex;gap:14px;align-items:flex-end}
.dt img{width:120px;aspect-ratio:5/7;object-fit:cover;border-radius:16px;box-shadow:0 8px 24px #0008}
.dt h1{font-size:20px;margin:0}.dt p{margin:2px 0;color:var(--mu);font-size:13px}
.body{padding:0 16px calc(30px + var(--sb));max-width:900px;margin:auto}
.stats{display:flex;gap:8px;margin:14px 0}.stats div{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:8px;text-align:center;font-size:12px;color:var(--mu)}.stats b{display:block;font-size:17px;color:var(--tx)}
.ch{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--card);border:1px solid var(--bd);border-radius:14px;margin:8px 0;cursor:pointer}
.ch.cur{border-color:var(--ac)}
.cm{background:var(--card);border-radius:14px;padding:10px 12px;margin:8px 0;font-size:14px}.cm small{color:var(--mu)}
.stars{font-size:26px;color:#f5b301;cursor:pointer;letter-spacing:4px}
.in{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin:6px 0}
.pf{text-align:center;padding:20px 0}.av{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));margin:auto;display:grid;place-items:center;font-size:34px;font-weight:800;color:#fff}
#rd{background:#000;z-index:30}
.rb{position:fixed;inset-inline:0;z-index:2;display:flex;align-items:center;gap:10px;padding:calc(10px + var(--sa)) 12px 10px;background:#000c;color:#fff;transition:transform .25s}
.rb.h{transform:translateY(-110%)}.rb span{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pr{position:fixed;top:0;inset-inline:0;height:3px;background:linear-gradient(90deg,var(--ac),var(--ac2));transform-origin:right;transform:scaleX(0);z-index:3}
#rd img{display:block;width:100%;max-width:720px;margin:auto;min-height:200px}
.nx{max-width:720px;margin:auto;padding:24px 16px calc(40px + var(--sb));display:flex;gap:10px}.nx .btn{flex:1}
#toast{position:fixed;bottom:calc(84px + var(--sb));inset-inline:0;margin:auto;width:max-content;max-width:88%;background:#222;color:#fff;padding:10px 18px;border-radius:14px;z-index:60;display:none;font-size:14px}
</style>
</head>
<body>
<div id="shell">
<div class="top"><span class="logo">MangaVerse</span><span style="flex:1"></span><button class="ic" id="th">🌓</button></div>
<div id="view"></div>
<nav class="tabs" id="tabs"></nav>
</div>
<div class="sheet" id="sh"></div>
<div class="sheet" id="rd"></div>
<div id="toast"></div>
<script>
const SB=supabase.createClient('https://xvvoaatisbfdbsvighqh.supabase.co','sb_publishable_az9WH3N4g31tu1JD3_HIaQ_gWiIrz_4');
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let M=[],ready=false,user=null,prof=null,favs=new Set(),follows=new Set(),hist={},st='all',orig=false,tab='home',genre='الكل',sort='new',q='',cur=null;
try{const t=localStorage.getItem('mvt');if(t)document.documentElement.dataset.t=t}catch(e){}
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.i);toast.i=setTimeout(()=>t.style.display='none',2600)};
const gn=m=>(m.manga_genres||[]).map(x=>x.genres?.name).filter(Boolean);
const ph='data:image/svg+xml;utf8,'+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 5 7'><rect width='5' height='7' fill='#232848'/></svg>");
const img=u=>`src="${esc(u||ph)}" onerror="this.onerror=null;this.src='${ph}'"`;
const card=m=>`<div class="card" onclick="openM(${m.id})"><img loading="lazy" ${img(m.cover_url)} alt=""><div class="t">${esc(m.title)}</div><div class="s">${esc(gn(m)[0]||'')} · ${m.status=='completed'?'مكتملة':'مستمرة'}</div></div>`;
const grid=l=>l.length?`<div class="grid">${l.map(card).join('')}</div>`:'<div class="empty"><i>🔍</i>لا توجد نتائج</div>';
const skel=n=>`<div class="grid">${'<div class="sk"></div>'.repeat(n)}</div>`;
function tabs(){$('#tabs').innerHTML=[['home','🏠','الرئيسية'],['explore','🧭','استكشاف'],['feed','💬','المجتمع'],['fav','❤️','المفضلة'],['me','👤','حسابي']].map(([k,i,l])=>`<button class="${tab==k?'on':''}" onclick="go('${k}')"><i>${i}</i>${l}</button>`).join('')}
function go(t){tab=t;render();$('#view').scrollTop=0}
function render(){tabs();const v=$('#view');if(!ready){v.innerHTML='<div class="pg">'+skel(9)+'</div>';return}
 v.innerHTML='<div class="pg">'+({home,explore,feed,fav,me}[tab])()+'</div>';if(tab=='feed')loadFeed();if(tab=='home')loadNew();if(tab=='me'&&user)loadNotif()}
function home(){const top=[...M].sort((a,b)=>b.views-a.views).slice(0,5),
 cont=Object.values(hist).sort((a,b)=>b.updated_at.localeCompare(a.updated_at)).map(h=>M.find(m=>m.id==h.manga_id)).filter(Boolean);
 return `<div class="feat">${top.map(m=>`<div class="fc" onclick="openM(${m.id})"><img ${img(m.cover_url)} alt=""><div><b>${esc(m.title)}</b><span>${esc(gn(m).slice(0,2).join(' · '))}</span></div></div>`).join('')}</div>`+
 (cont.length?`<h2>🕘 أكمل القراءة</h2><div class="row">${cont.map(card).join('')}</div>`:'')+
 `${recs().length?`<h2>🎯 مقترح لك</h2><div class="row">${recs().map(card).join('')}</div>`:''}<div id="nc"></div><h2>🔥 الأكثر مشاهدة <a onclick="sort='pop';go('explore')">عرض الكل</a></h2><div class="row">${top.concat([...M].sort((a,b)=>b.views-a.views).slice(5,12)).map(card).join('')}</div>
 <h2>✨ أحدث الإضافات <a onclick="sort='new';go('explore')">عرض الكل</a></h2><div class="row">${M.slice(0,10).map(card).join('')}</div>
 <h2>🎲 لا تعرف ماذا تقرأ؟</h2><button class="btn b" onclick="openM(M[Math.floor(Math.random()*M.length)].id)">اختيار عشوائي</button>`}
function explore(){const gs=['الكل',...new Set(M.flatMap(gn))];
 let l=M.filter(m=>(genre=='الكل'||gn(m).includes(genre))&&(!q||(m.title+(m.author||'')).toLowerCase().includes(q.toLowerCase()))&&(st=='all'||m.status==st)&&(!orig||m.is_original));
 if(sort=='pop')l.sort((a,b)=>b.views-a.views);if(sort=='az')l.sort((a,b)=>a.title.localeCompare(b.title,'ar'));
 return `<input class="sr" id="sq" placeholder="🔎 ابحث عن مانغا أو مؤلف…" value="${esc(q)}" oninput="q=this.value;clearTimeout(window.qt);window.qt=setTimeout(()=>{render();$('#sq').focus();$('#sq').setSelectionRange(q.length,q.length)},250)">
 <div class="chips">${gs.map(g=>`<span class="chip ${g==genre?'on':''}" onclick="genre='${esc(g)}';render()">${esc(g)}</span>`).join('')}</div>
 <div class="chips">${[['new','الأحدث'],['pop','الأكثر مشاهدة'],['az','أبجديًا']].map(([k,n])=>`<span class="chip ${sort==k?'on':''}" onclick="sort='${k}';render()">${n}</span>`).join('')}</div><div class="chips">${[['all','كل الحالات'],['ongoing','مستمرة'],['completed','مكتملة']].map(([k,n])=>`<span class="chip ${st==k?'on':''}" onclick="st='${k}';render()">${n}</span>`).join('')}<span class="chip ${orig?'on':''}" onclick="orig=!orig;render()">✨ أعمال أصلية</span></div><br>`+grid(l)}
function fav(){if(!user)return `<div class="empty"><i>❤️</i>سجّل الدخول لحفظ مفضلتك<br><br><button class="btn" onclick="go('me')">تسجيل الدخول</button></div>`;
 const l=M.filter(m=>favs.has(m.id));return `<h2>❤️ المفضلة (${l.length})</h2>`+(l.length?grid(l):'<div class="empty"><i>📚</i>لم تضف شيئًا بعد</div>')}
function me(){if(user)return `<div class="pf"><div class="av">${esc((prof?.username||user.email||'؟')[0].toUpperCase())}</div><h2 style="justify-content:center">${esc(prof?.username||'مستخدم')}</h2><div style="color:var(--mu)">${esc(user.email)}</div></div>
 <div class="stats"><div><b>${favs.size}</b>مفضلة</div><div><b>${Object.keys(hist).length}</b>قرأت</div><div><b>${prof?.coins??0}</b>عملات</div></div><p style="color:var(--mu)">${esc(prof?.bio||'')}</p><button class="btn g b" onclick="editBio()">✏️ تعديل النبذة</button><br><br><button class="btn b" onclick="pubForm()">＋ نشر عمل جديد</button>${M.filter(m=>m.owner_id==user.id).length?`<h2>✍️ أعمالي</h2><div class="row">${M.filter(m=>m.owner_id==user.id).map(card).join('')}</div>`:''}<div id="nf"></div><br><button class="btn g b" onclick="SB.auth.signOut()">تسجيل الخروج</button>`;
 return `<div class="pf"><div class="av">👤</div><h2 style="justify-content:center">مرحبًا بك</h2><p style="color:var(--mu)">سجّل لحفظ المفضلة والتقدّم والتقييم</p></div>
 <input class="in" id="ae" type="email" dir="ltr" placeholder="البريد الإلكتروني"><input class="in" id="ap" type="password" dir="ltr" placeholder="كلمة المرور"><input class="in" id="an" placeholder="اسم المستخدم (للتسجيل فقط)"><br><br>
 <button class="btn b" onclick="signin()">دخول</button><br><br><button class="btn g b" onclick="signup()">إنشاء حساب</button>`}
async function signin(){const {error}=await SB.auth.signInWithPassword({email:$('#ae').value,password:$('#ap').value});error?toast(error.message):toast('أهلًا بك 👋')}
async function signup(){const u=$('#an').value.trim();if(u.length<2)return toast('اسم المستخدم قصير');
 const {data,error}=await SB.auth.signUp({email:$('#ae').value,password:$('#ap').value,options:{data:{username:u}}});if(error)return toast(error.message);
 if(data.user&&data.session)await SB.from('profiles').upsert({id:data.user.id,username:u});toast(data.session?'تم إنشاء الحساب 🎉':'تحقق من بريدك لتأكيد الحساب')}
async function loadUser(){favs=new Set();hist={};prof=null;if(user){const [f,h,p]=await Promise.all([SB.from('favorites').select('manga_id').eq('user_id',user.id),SB.from('read_history').select('*').eq('user_id',user.id),SB.from('profiles').select('*').eq('id',user.id).maybeSingle()]);
 (f.data||[]).forEach(x=>favs.add(x.manga_id));follows=new Set();SB.from('manga_follows').select('manga_id').eq('user_id',user.id).then(r=>(r.data||[]).forEach(x=>follows.add(x.manga_id)));(h.data||[]).forEach(x=>hist[x.manga_id]=x);prof=p.data}}
const need=()=>{if(user)return false;closeS();go('me');toast('سجّل الدخول أولًا');return true};
async function openM(id){const m=M.find(x=>x.id==id);cur=m;$('#sh').innerHTML='<div class="hd"><img '+img(m.cover_url)+' alt=""></div><div class="body"><div class="skel sk" style="height:200px;margin-top:20px"></div></div>';$('#sh').classList.add('on');
 const [c,r,cm]=await Promise.all([SB.from('chapters').select('id,number,title').eq('manga_id',id).order('number'),SB.from('ratings').select('score').eq('manga_id',id),SB.from('comments').select('id,body,profiles(username)').eq('manga_id',id).is('chapter_id',null).order('created_at',{ascending:false}).limit(30)]);
 m.ch=c.data||[];const sc=r.data||[],avg=sc.length?(sc.reduce((a,x)=>a+x.score,0)/sc.length).toFixed(1):'—',h=hist[id],f=favs.has(id);
 const start=h?m.ch.findIndex(x=>x.number==h.chapter_number):0;const sim=M.filter(x=>x.id!=id&&gn(x).some(g=>gn(m).includes(g))).slice(0,8);
 $('#sh').innerHTML=`<div class="hd"><img ${img(m.cover_url)} alt=""><button class="ic x" onclick="closeS()">✕</button></div>
 <div class="dt"><img ${img(m.cover_url)} alt=""><div><h1>${esc(m.title)}</h1><p>${esc(m.author||'')}${m.year?' · '+m.year:''}</p><p>${esc(gn(m).join('، '))}</p></div></div>
 <div class="body"><div class="stats"><div><b>⭐ ${avg}</b>${sc.length} تقييم</div><div><b>${m.ch.length}</b>فصل</div><div><b>${m.views||0}</b>مشاهدة</div></div>
 <div style="display:flex;gap:8px">${m.info_only||!m.ch.length?'':`<button class="btn" style="flex:1" onclick="read(${Math.max(start,0)})">${h?'أكمل القراءة':'ابدأ القراءة'}</button>`}<button class="btn g" onclick="toggleFav(${id})">${f?'💔':'❤️'}</button><button class="btn g" onclick="follow(${id})">${follows.has(id)?'🔕':'🔔'}</button>${user&&m.owner_id==user.id?`<button class="btn g" onclick="chForm(${id})">＋فصل</button><button class="btn g" onclick="delM(${id})">🗑</button>`:''}</div>
 <p style="color:var(--mu);line-height:1.8">${esc(m.description||'')}</p>
 <div class="stars">${[1,2,3,4,5].map(n=>`<span onclick="rate(${n})">☆</span>`).join('')}</div>
 ${m.info_only?'':`<h2>الفصول</h2>${m.ch.map((x,i)=>`<div class="ch ${h?.chapter_number==x.number?'cur':''}" onclick="read(${i})"><span>${esc(x.title||'الفصل '+x.number)}</span><span style="color:var(--mu)">${h?.chapter_number==x.number?'آخر قراءة':'←'}</span></div>`).join('')||'<div class="empty">لا فصول بعد</div>'}`}
 ${sim.length?`<h2>📚 أعمال مشابهة</h2><div class="row">${sim.map(card).join('')}</div>`:''}<h2>💬 التعليقات</h2>${(cm.data||[]).map(x=>`<div class="cm"><small>${esc(x.profiles?.username||'مستخدم')}</small><br>${esc(x.body)}<div style="margin-top:6px;font-size:13px"><span style="cursor:pointer" onclick="likeC(${x.id})">❤️ أعجبني</span> <span style="cursor:pointer;margin-inline-start:12px" onclick="repC(${x.id})">🚩 إبلاغ</span></div></div>`).join('')||'<div class="empty">كن أول من يعلّق</div>'}
 <div style="display:flex;gap:8px;margin-top:10px"><input class="in" id="ci" placeholder="اكتب تعليقًا…" style="margin:0"><button class="btn" onclick="addC()">إرسال</button></div></div>`}
function closeS(){$('#sh').classList.remove('on')}
async function toggleFav(id){if(need())return;favs.has(id)?await SB.from('favorites').delete().match({user_id:user.id,manga_id:id}):await SB.from('favorites').insert({user_id:user.id,manga_id:id});await loadUser();toast(favs.has(id)?'أُضيفت للمفضلة':'أُزيلت');openM(id);render()}
async function rate(n){if(need())return;const {error}=await SB.from('ratings').upsert({user_id:user.id,manga_id:cur.id,score:n});toast(error?error.message:'شكرًا لتقييمك ⭐');if(!error)openM(cur.id)}
async function addC(){if(need())return;const b=$('#ci').value.trim();if(!b)return;const {error}=await SB.from('comments').insert({user_id:user.id,manga_id:cur.id,body:b});error?toast(error.message):openM(cur.id)}
async function read(i){const m=cur,c=m.ch[i],r=$('#rd');r.innerHTML='<div style="padding:40vh 0;text-align:center;color:#fff">جارٍ التحميل…</div>';r.classList.add('on');
 const {data}=await SB.from('chapters').select('pages').eq('id',c.id).single();
 if(user){hist[m.id]={manga_id:m.id,chapter_number:c.number,updated_at:new Date().toISOString()};SB.from('read_history').upsert(hist[m.id]).then(()=>{})}
 const last=i>=m.ch.length-1;
 r.innerHTML=`<div id="pr"></div><div class="rb" id="rbar"><button class="ic" onclick="closeR()">✕</button><span>${esc(m.title)} — ${esc(c.title||'الفصل '+c.number)}</span></div>`+
 ((data?.pages||[]).map(p=>`<img loading="lazy" ${img(p)} alt="">`).join('')||'<div class="empty" style="padding-top:40vh">لا توجد صفحات لهذا الفصل</div>')+
 `<div class="nx">${i>0?`<button class="btn g" onclick="read(${i-1})">→ السابق</button>`:''}${last?`<button class="btn" onclick="closeR()">انتهى ✓</button>`:`<button class="btn" onclick="read(${i+1})">التالي ←</button>`}</div>`;
 r.scrollTop=0;r.onclick=e=>{if(e.target.closest('button'))return;$('#rbar').classList.toggle('h')};
 r.onscroll=()=>{$('#pr').style.transform=`scaleX(${r.scrollTop/Math.max(1,r.scrollHeight-r.clientHeight)})`}}
function closeR(){$('#rd').classList.remove('on');if(cur)openM(cur.id);render()}
async function reload(){const m=await SB.from('manga').select('*,manga_genres(genres(name))').order('created_at',{ascending:false});M=m.data||M}
const rf=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,800/i.width),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.7))};i.src=x.result};x.readAsDataURL(f)});
async function pubForm(){const {data:g}=await SB.from('genres').select('id,name');
 $('#sh').innerHTML=`<div class="body" style="padding-top:calc(16px + var(--sa))"><button class="ic" onclick="closeS()">✕</button><h2>＋ نشر عمل جديد</h2><input class="in" id="pt" placeholder="العنوان *"><input class="in" id="pa" placeholder="المؤلف"><select class="in" id="pg">${(g||[]).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><select class="in" id="ps"><option value="ongoing">مستمرة</option><option value="completed">مكتملة</option></select><textarea class="in" id="pd" rows="3" style="font:inherit;color:inherit" placeholder="الوصف"></textarea><small style="color:var(--mu)">الغلاف</small><input type="file" id="pcv" accept="image/*" class="in"><input class="in" id="pn" type="number" value="1" placeholder="رقم الفصل"><input class="in" id="pch" placeholder="عنوان الفصل"><small style="color:var(--mu)">صور الفصل بالترتيب</small><input type="file" id="ppg" accept="image/*" multiple class="in"><br><br><button class="btn b" id="pb" onclick="publish()">نشر</button></div>`;$('#sh').classList.add('on')}
async function publish(){const t=$('#pt').value.trim();if(!t)return toast('العنوان مطلوب');const b=$('#pb');b.disabled=true;b.textContent='جارٍ الرفع…';
 try{const cf=$('#pcv').files[0],pf=[...$('#ppg').files],cover=cf?await rf(cf):null,pages=await Promise.all(pf.map(rf));
 const {data:m,error}=await SB.from('manga').insert({title:t,author:$('#pa').value.trim()||null,description:$('#pd').value.trim(),status:$('#ps').value,cover_url:cover,owner_id:user.id,language:'ar',is_original:true}).select('id').single();if(error)throw error;
 if($('#pg').value)await SB.from('manga_genres').insert({manga_id:m.id,genre_id:+$('#pg').value});
 if(pages.length){const {error:e2}=await SB.from('chapters').insert({manga_id:m.id,number:+$('#pn').value||1,title:$('#pch').value.trim()||null,pages});if(e2)throw e2}
 await reload();closeS();go('home');toast('تم النشر ✅')}catch(e){toast(e.message||'فشل النشر');b.disabled=false;b.textContent='نشر'}}
async function delM(id){if(!confirm('حذف هذا العمل نهائيًا؟'))return;await SB.from('chapters').delete().eq('manga_id',id);await SB.from('manga_genres').delete().eq('manga_id',id);const {error}=await SB.from('manga').delete().eq('id',id);if(error)return toast(error.message);await reload();closeS();render();toast('تم الحذف')}
function feed(){return '<h2>💬 المجتمع</h2><div id="fd"><div class="empty">جارٍ التحميل…</div></div>'}
async function loadFeed(){const {data,error}=await SB.from('posts').select('id,body,user_id,created_at,profiles(username),post_likes(user_id)').order('created_at',{ascending:false}).limit(40);const el=$('#fd');if(!el)return;if(error){el.innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}
 el.innerHTML=(user?`<div style="display:flex;gap:8px"><input class="in" id="pb2" placeholder="شارك شيئًا مع المجتمع…" style="margin:0"><button class="btn" onclick="post()">نشر</button></div>`:'<div class="empty">سجّل الدخول للمشاركة</div>')+(data.map(p=>{const l=p.post_likes||[],mine=user&&l.some(x=>x.user_id==user.id);return `<div class="cm"><small>${esc(p.profiles?.username||'مستخدم')} · ${new Date(p.created_at).toLocaleDateString('ar')}</small><br>${esc(p.body)}<div style="margin-top:6px"><span style="cursor:pointer" onclick="likeP(${p.id},${!!mine})">${mine?'❤️':'🤍'} ${l.length}</span>${user&&p.user_id==user.id?` <span style="cursor:pointer;margin-inline-start:12px" onclick="delP(${p.id})">🗑</span>`:''}</div></div>`}).join('')||'<div class="empty"><i>💬</i>لا منشورات بعد</div>')}
async function post(){const b=$('#pb2').value.trim();if(!b)return;const {error}=await SB.from('posts').insert({user_id:user.id,body:b});error?toast(error.message):loadFeed()}
async function likeP(id,l){if(need())return;l?await SB.from('post_likes').delete().match({user_id:user.id,post_id:id}):await SB.from('post_likes').insert({user_id:user.id,post_id:id});loadFeed()}
async function delP(id){const {error}=await SB.from('posts').delete().eq('id',id);error?toast(error.message):loadFeed()}
async function follow(id){if(need())return;const f=follows.has(id);f?await SB.from('manga_follows').delete().match({user_id:user.id,manga_id:id}):await SB.from('manga_follows').insert({user_id:user.id,manga_id:id});f?follows.delete(id):follows.add(id);toast(f?'أُلغيت المتابعة':'تمت المتابعة 🔔');openM(id)}
async function likeC(id){if(need())return;const r=await SB.from('comment_likes').insert({user_id:user.id,comment_id:id});toast(r.error?'أعجبك من قبل':'❤️')}
async function repC(id){if(need())return;const s=prompt('سبب البلاغ؟');if(s===null)return;const {error}=await SB.from('reports').insert({reporter_id:user.id,comment_id:id,reason:s});toast(error?error.message:'تم إرسال البلاغ')}
async function editBio(){const b=prompt('نبذة عنك',prof?.bio||'');if(b===null)return;const {error}=await SB.from('profiles').update({bio:b.slice(0,200)}).eq('id',user.id);if(error)return toast(error.message);await loadUser();render()}
async function loadNotif(){const {data}=await SB.from('notifications').select('*').eq('user_id',user.id).order('created_at',{ascending:false}).limit(15);const el=$('#nf');if(!el)return;el.innerHTML='<h2>🔔 الإشعارات</h2>'+((data||[]).map(n=>`<div class="cm" style="${n.is_read?'opacity:.6':''}">${esc(n.body)}</div>`).join('')||'<div class="empty">لا إشعارات</div>');SB.from('notifications').update({is_read:true}).eq('user_id',user.id).eq('is_read',false).then(()=>{})}
function chForm(id){const m=M.find(x=>x.id==id);$('#sh').innerHTML=`<div class="body" style="padding-top:calc(16px + var(--sa))"><button class="ic" onclick="openM(${id})">✕</button><h2>＋ فصل جديد — ${esc(m.title)}</h2><input class="in" id="cn" type="number" value="${(m.ch||[]).length+1}"><input class="in" id="ct" placeholder="عنوان الفصل"><small style="color:var(--mu)">صور الفصل بالترتيب</small><input type="file" id="cp" accept="image/*" multiple class="in"><br><br><button class="btn b" id="cb" onclick="saveCh(${id})">نشر الفصل</button></div>`}
async function saveCh(id){const pf=[...$('#cp').files];if(!pf.length)return toast('اختر صور الفصل');const b=$('#cb');b.disabled=true;b.textContent='جارٍ الرفع…';
 try{const pages=await Promise.all(pf.map(rf));const {error}=await SB.from('chapters').insert({manga_id:id,number:+$('#cn').value||1,title:$('#ct').value.trim()||null,pages});if(error)throw error;toast('تم نشر الفصل ✅');openM(id)}catch(e){toast(e.message||'فشل');b.disabled=false;b.textContent='نشر الفصل'}}
function recs(){const liked=M.filter(m=>favs.has(m.id)||hist[m.id]||follows.has(m.id));if(!liked.length)return[];const w={};liked.forEach(m=>gn(m).forEach(g=>w[g]=(w[g]||0)+(favs.has(m.id)?2:1)));
 return M.filter(m=>!liked.includes(m)).map(m=>({m,s:gn(m).reduce((a,g)=>a+(w[g]||0),0)+Math.log10((m.views||0)+1)*.1})).filter(x=>x.s>=1).sort((a,b)=>b.s-a.s).slice(0,10).map(x=>x.m)}
function loadNew(){const el=$('#nc');if(!el||!user||!follows.size)return;SB.from('chapters').select('id,number,title,manga_id,created_at').in('manga_id',[...follows]).order('created_at',{ascending:false}).limit(8).then(r=>{const d=r.data||[];if(!d.length||!$('#nc'))return;
 $('#nc').innerHTML='<h2>🆕 جديد من متابعاتك</h2>'+d.map(c=>{const m=M.find(x=>x.id==c.manga_id),seen=hist[c.manga_id]&&hist[c.manga_id].chapter_number>=c.number;return m?`<div class="ch" onclick="openM(${m.id})"><span>${esc(m.title)} — ${esc(c.title||'الفصل '+c.number)}</span><span style="color:${seen?'var(--mu)':'var(--ac)'}">${seen?'مقروء':'جديد'}</span></div>`:''}).join('')})}
$('#th').onclick=()=>{const d=document.documentElement,n=d.dataset.t=='light'?'dark':'light';d.dataset.t=n;try{localStorage.setItem('mvt',n)}catch(e){}};
(async()=>{render();
 const {data:{session}}=await SB.auth.getSession();user=session?.user||null;
 SB.auth.onAuthStateChange(async(_,s)=>{user=s?.user||null;await loadUser();render()});
 const [m]=await Promise.all([SB.from('manga').select('*,manga_genres(genres(name))').order('created_at',{ascending:false}),loadUser()]);
 if(m.error)toast('تعذّر تحميل المكتبة');M=m.data||[];ready=true;render()})();
</script>
